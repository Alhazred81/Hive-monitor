<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaptármonitor Beállítások</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="card">
      <h2>Kaptármonitor Hálózat</h2>
      <form
        onsubmit="
          event.preventDefault();
          submitConfig();
        "
      >
        <input
          type="text"
          id="ssid"
          name="ssid"
          placeholder="WiFi SSID"
          required
        /><br />
        <input
          type="password"
          id="password"
          name="password"
          placeholder="WiFi Jelszó"
        /><br />
        <button type="submit">Mentés és Újraindítás</button>
      </form>
    </div>
    <script>
      function submitConfig() {
        const ssidVal = document.getElementById("ssid").value;
        const passVal = document.getElementById("password").value;

        fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `ssid=${encodeURIComponent(ssidVal)}&password=${encodeURIComponent(passVal)}`,
        })
          .then((response) => response.text())
          .then((data) => {
            alert("Beállítások elmentve. Az eszköz újraindul.");
          })
          .catch((error) => console.error("Hiba:", error));
      }
    </script>
  </body>
</html>
